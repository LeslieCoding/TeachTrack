version: "4.1.0"
project: "TeachTrack"
assumptions:
  - id: "A-001"
    statement: "OPPO Pad serial 2d64f765 is the only authorized physical-test target."
    source: "USER_EXPLICIT"
    status: "ACTIVE"
  - id: "A-002"
    statement: "The app must remain usable without a cloud provider, account, network, or API key."
    source: "USER_EXPLICIT"
    status: "ACTIVE"
  - id: "A-003"
    statement: "Release signing material and real cloud provider credentials are external inputs and are not invented."
    source: "USER_EXPLICIT"
    status: "ACTIVE_EXTERNAL"
  - id: "A-004"
    statement: "AI-generated operations require local validation and visible confirmation before writes."
    source: "USER_INFERRED"
    status: "ACTIVE"
  - id: "A-005"
    statement: "A placeholder test command may use English text on a device when ColorOS input automation cannot enter Chinese text."
    source: "AI_RECOMMENDED"
    status: "ACTIVE_TEST_ONLY"
  - id: "A-006"
    statement: "\"AI operates every module's every function\" (T3-AI-COVERAGE-001) does not include letting the AI reconfigure its own Provider/OAuth settings (endpoint, model, API key, login state); that surface stays a manual Settings-only boundary."
    source: "AI_RECOMMENDED"
    status: "ACTIVE"
  - id: "A-007"
    statement: "\"AI operates every module's every function\" does not require new hard-delete actions for course/score/homework/exam/communication records; the project's standing archive-before-delete principle (AI_SPEC/03_SCOPE.md) continues to apply, so coverage is expressed as create/update/status-transition actions for those entities, not physical deletion."
    source: "AI_RECOMMENDED"
    status: "ACTIVE"
  - id: "A-008"
    statement: "Workspace creation/attach and .ttbackup create/restore cannot be fully voice/text-driven because Android Scoped Storage requires a user gesture through a system picker for a fresh directory/file grant; AI coverage for these is expressed as navigate-and-instruct rather than direct execution."
    source: "AI_RECOMMENDED"
    status: "ACTIVE"
  - id: "A-009"
    statement: "Referencing https://github.com/OpenMinis/OpenMinis for a floating-window UI means the user wants that UX pattern (a floating, scrollable chat window), not literal reuse of its GPLv3 general-agent codebase; the floating window this project builds is in-app only, not a system-wide cross-app overlay requiring the special 'display over other apps' permission."
    source: "AI_RECOMMENDED"
    status: "ACTIVE"
