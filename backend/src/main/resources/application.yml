server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: teachtrack-backend
  datasource:
    url: ${TEACHTRACK_DB_URL:jdbc:postgresql://127.0.0.1:55432/teachtrack}
    username: ${TEACHTRACK_DB_USER:teachtrack}
    password: ${TEACHTRACK_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

teachtrack:
  auth:
    bootstrap-token: ${TEACHTRACK_BOOTSTRAP_TOKEN:}
  migration:
    allowed-root: ${TEACHTRACK_MIGRATION_ROOT:./}
  export:
    cjk-font: ${TEACHTRACK_CJK_FONT:C:/Windows/Fonts/simhei.ttf}
  storage:
    provider: ${TEACHTRACK_STORAGE_PROVIDER:local}
    local-root: ${TEACHTRACK_STORAGE_ROOT:./data/storage}
    secret: ${TEACHTRACK_STORAGE_SECRET:}
    download-ttl-seconds: 600
    s3:
      endpoint: ${TEACHTRACK_S3_ENDPOINT:}
      region: ${TEACHTRACK_S3_REGION:auto}
      bucket: ${TEACHTRACK_S3_BUCKET:}
      access-key: ${TEACHTRACK_S3_ACCESS_KEY:}
      secret-key: ${TEACHTRACK_S3_SECRET_KEY:}
    baidu:
      # baidu-pan uses the official Baidu PCS API through the bypy CLI.
      bypy: ${TEACHTRACK_BYPY:bypy}
      remote-root: ${TEACHTRACK_BAIDU_ROOT:teachtrack}
      timeout-seconds: ${TEACHTRACK_BAIDU_TIMEOUT:120}

logging:
  level:
    root: INFO
    com.leslie.teachtrack: INFO
