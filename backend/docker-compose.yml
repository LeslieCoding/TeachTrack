services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: teachtrack
      POSTGRES_USER: teachtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teachtrack_dev_only}
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teachtrack -d teachtrack"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: .
    environment:
      TEACHTRACK_DB_URL: jdbc:postgresql://postgres:5432/teachtrack
      TEACHTRACK_DB_USER: teachtrack
      TEACHTRACK_DB_PASSWORD: ${POSTGRES_PASSWORD:-teachtrack_dev_only}
      TEACHTRACK_BOOTSTRAP_TOKEN: ${TEACHTRACK_BOOTSTRAP_TOKEN:-}
      TEACHTRACK_STORAGE_PROVIDER: s3
      TEACHTRACK_STORAGE_SECRET: ${TEACHTRACK_STORAGE_SECRET:-}
      TEACHTRACK_S3_ENDPOINT: http://minio:9000
      TEACHTRACK_S3_REGION: us-east-1
      TEACHTRACK_S3_BUCKET: ${TEACHTRACK_S3_BUCKET:-teachtrack}
      TEACHTRACK_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      TEACHTRACK_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata:
